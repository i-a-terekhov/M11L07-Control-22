<!-- Основное содержание -->
<div class="content ps-2 pe-2 ps-lg-3 pe-lg-3 ps-xl-5 pe-xl-5 d-flex flex-column">
    <h1 class="m-2 mb-lg-3 mt-xl-5 ps-1 pb-1">Создание дохода/расхода</h1>

    <!-- Область основных действий -->
    <div class="manipulate-operation-area h-100 mt-lg-3 ms-2 me-2 ps-1 pt-2 d-flex flex-column">

        <div class="error invalid-feedback mb-1 ms-1" id="server-error">Не удалось связаться с сервером</div>
        <div class="error invalid-feedback mb-1 ms-1" id="common-error">Проверьте поля на корректность</div>

        <select class="form-select mb-2 text-black" id="operation-type" name="operation-type"
                aria-label="operation-type">
            <option value="income">Доход</option>
            <option value="expense">Расход</option>
        </select>

        <select class="form-select mb-2 text-black" id="operation-name" name="operation-name"
                aria-label="operation-name">
            <option value=""></option>
            <option value="Жилье">Жилье</option>
            <option value="Продукты">Продукты</option>
        </select>

        <input type="text" class="form-control mb-2 text-black" id="operation-amount" name="operation-amount"
               value=""
               placeholder="Сумма в $...">
        <input type="date" class="form-control mb-2 text-black" id="operation-date" name="operation-date"
               value=""
               placeholder="Дата...">
        <input type="text" class="form-control mb-2 text-black" id="operation-comment" name="operation-comment"
               value=""
               placeholder="Комментарий...">
        <div class="buttons mt-2">
            <button type="button" class="btn btn-success mt-1" id="operation-save">
                Создать
            </button>
            <button type="button" class="btn btn-danger mt-1" id="operation-cancel">
                Отмена
            </button>
        </div>
    </div>

    <!-- #PART ----- Попап с вопросом о необходимости операции -->
    <div class="modal fade" id="modal-answer" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog pt-1">
            <div class="modal-content pt-1">
                <div class="modal-header mt-3 pb-3 justify-content-center text-center">
                    <h4 class="modal-title">
                        Вы хотите сохранить изменения?<br>
                    </h4>
                </div>
                <div class="modal-footer pt-0 pb-4 mb-3">
                    <button type="button" class="btn btn-success" data-bs-dismiss="modal" id="modal-answer-yes">
                        Да, сохранить
                    </button>
                    <button type="button" class="btn btn-danger" data-bs-dismiss="modal">Не сохранять</button>
                </div>
            </div>
        </div>
    </div>

    <!-- #PART ----- Попап подтверждения успешности операции -->
    <div class="modal fade" id="modal-confirm" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog pt-1">
            <div class="modal-content pt-1">
                <div class="modal-header mt-3 pb-3 justify-content-center text-center">
                    <h4 class="modal-title">
                        Изменения внесены! Вернуться назад<br>
                    </h4>
                </div>
                <div class="modal-footer pt-0 pb-4 mb-3">
                    <button type="button" class="btn btn-success" data-bs-dismiss="modal" id="modal-confirm-return">
                        Вернуться
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
