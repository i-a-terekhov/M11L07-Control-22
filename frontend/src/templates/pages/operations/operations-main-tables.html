<!-- Основное содержание -->
<div class="content ps-2 pe-2 ps-lg-3 pe-lg-3 ps-xl-5 pe-xl-5 d-flex flex-column">
    <h1 class="m-2 mb-lg-3 mt-xl-5 ps-1 pb-1">Доходы и расходы</h1>

    <!-- Кнопки создания -->
    <div class="make-income-expenses-buttons m-2 mb-0 mt-lg-2 p-1 pt-2 pb-0 d-flex flex-row flex-wrap gap-2">
        <a class="btn btn-success mt-1" href="/operations-create?type=incomes">Создать доход</a>
        <a class="btn btn-danger mt-1" href="/operations-create?type=expenses">Создать расход</a>
    </div>

    <!-- Фильтр -->
    <div class="filter-bar m-2 mt-lg-4 mb-5 mb-lg-3 p-1 pt-3 d-flex flex-row flex-wrap gap-2 gap-sm-3" id="filter-bar">
        <button type="button" class="btn-filter btn me-1 ps-3 pe-3 btn-outline-secondary" id="btn-today">Сегодня
        </button>
        <button type="button" class="btn-filter btn me-1 ps-3 pe-3 btn-outline-secondary" id="btn-week">Неделя</button>
        <button type="button" class="btn-filter btn me-1 ps-3 pe-3 btn-outline-secondary" id="btn-month">Месяц</button>
        <button type="button" class="btn-filter btn me-1 ps-3 pe-3 btn-outline-secondary" id="btn-year">Год</button>
        <button type="button" class="btn-filter btn me-1 ps-3 pe-3 btn-outline-secondary" id="btn-all">Все</button>
        <div class="interval-section d-flex flex-wrap gap-2 gap-sm-3 flex-sm-row">
            <button type="button" class="btn-filter btn btn-outline-secondary" id="btn-period">Интервал</button>
            <div class="interval-section d-flex flex-row">
                <div class="interval d-flex gap-2 align-items-center">
                    <span>c</span>
                    <input type="text" class="form-control custom-date" id="interval-from-input"
                           placeholder="Дата">
                </div>
                <div class="interval d-flex gap-2 align-items-center">
                    <span>по</span>
                    <input type="text" class="form-control custom-date" id="interval-until-input"
                           placeholder="Дата">
                </div>
            </div>
        </div>
    </div>

    <!-- Область таблицы -->
    <div class="table-area mt-3 ms-2 me-2 pt-1 d-flex align-items-center flex-wrap">
        <table class="table table-hover table-bordered align-middle text-center">
            <thead class="">
            <tr>
                <th class="d-none d-lg-table-cell long-description" scope="col" style="width: 13%;">№ операции
                </th>
                <th class="d-none d-sm-table-cell" scope="col" style="width: 10%;">Тип</th>
                <th class="                      " scope="col" style="width: 21%;">Категория</th>
                <th class="                      " scope="col" style="width: 5%;">Сумма</th>
                <th class="d-none d-sm-table-cell" scope="col" style="width: 19%;">Дата</th>
                <th class="d-none d-sm-table-cell" scope="col">Комментарий</th>
                <th class="                      " scope="col" style="width: 12%;"></th>
            </tr>
            </thead>
            <tbody id="table-body">
            <tr class="name-elem-parent">
                <td class="d-none d-lg-table-cell">1</td>
                <td class="d-none d-sm-table-cell text-success">доход</td>
                <td class="name-of-entity        ">зарплата</td>
                <td class="                      ">500$</td>
                <td class="d-none d-sm-table-cell">11.09.2022</td>
                <td class="d-none d-sm-table-cell"></td>
                <td>
                    <div class="line-actions d-flex flex-row justify-content-end">
                        <button class="btn btn-sm action-delete" data-bs-toggle="modal" data-bs-target="#modal">
                            <svg width="13" height="15">
                                <use href="icons/layout-icons.svg#trash"></use>
                            </svg>
                        </button>
                        <button class="btn btn-sm action-edit">
                            <svg height="16" width="16">
                                <use href="icons/layout-icons.svg#pencil"></use>
                            </svg>
                        </button>
                    </div>
                </td>
            </tr>
            <tr class="name-elem-parent">
                <td class="d-none d-lg-table-cell">2</td>
                <td class="d-none d-sm-table-cell text-danger">расход</td>
                <td class="name-of-entity        ">жильё</td>
                <td class="                      ">2 500$</td>
                <td class="d-none d-sm-table-cell">12.09.2022</td>
                <td class="d-none d-sm-table-cell"></td>
                <td>
                    <div class="line-actions d-flex flex-row justify-content-end">
                        <button class="btn btn-sm action-delete" data-bs-toggle="modal" data-bs-target="#modal">
                            <svg height="15" width="13">
                                <use href="icons/layout-icons.svg#trash"></use>
                            </svg>
                        </button>
                        <button class="btn btn-sm action-edit">
                            <svg height="16" width="16">
                                <use href="icons/layout-icons.svg#pencil"></use>
                            </svg>
                        </button>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>

    </div>

    <!-- #PART ----- Попап -->
    <div class="modal fade" id="modal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog pt-1">
            <div class="modal-content pt-1">
                <div class="modal-header mt-3 pb-3 justify-content-center text-center">
                    <h4 class="modal-title">
                        Вы действительно хотите удалить операцию?<br>

                    </h4>
                </div>
                <div class="modal-footer pt-0 pb-4 mb-3">
                    <button type="button" class="btn btn-success" data-bs-dismiss="modal" id="modal-answer-yes">Да,
                        удалить
                    </button>
                    <button type="button" class="btn btn-danger" data-bs-dismiss="modal">Не удалять</button>
                </div>
            </div>
        </div>
    </div>
</div>
